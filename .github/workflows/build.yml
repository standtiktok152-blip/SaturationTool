name: Build Windows EXE
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Compile
      run: |
        cl.exe /MT /O2 /EHsc /D UNICODE /D _UNICODE SaturationTool.cpp /link /SUBSYSTEM:WINDOWS /ENTRY:WinMain /OUT:SaturationTool.exe
      shell: cmd

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: SaturationTool
        path: SaturationTool.exe
